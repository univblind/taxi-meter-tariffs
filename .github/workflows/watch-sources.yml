# 요금표 출처 감시 (요금표 저장소 univblind/taxi-meter-tariffs 의 .github/workflows/ 에 올라간다)
#
# 매주 월요일 아침(한국 시간)에 요금표의 출처 페이지들을 다시 읽어, 요금이 바뀌었을 수 있는
# 신호가 새로 생기면 이슈를 만든다. 저장소 주인에게 GitHub 이 메일로 알려준다.
# 무료(공개 저장소의 GitHub Actions)이고 서버가 필요 없다.
name: 요금표 출처 감시

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 출처 확인
        id: watch
        run: node watch/watch-sources.js tariffs.json watch/state.json watch/report.md
      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A watch/state.json watch/report.md watch/pages
          git diff --cached --quiet || git commit -m "출처 감시 결과 $(date +%F)"
          git push
      - name: 점검이 필요하면 이슈로 알림
        if: steps.watch.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "요금표 점검 필요 ($(date +%F))" --body-file watch/report.md
